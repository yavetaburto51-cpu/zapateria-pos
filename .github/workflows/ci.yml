name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret_root_password
          MYSQL_DATABASE: zapateria_pos
          MYSQL_USER: zapateria_user
          MYSQL_PASSWORD: secret_user_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none
          extensions: mbstring, bcmath, dom, fileinfo, openssl, pdo, pdo_mysql, tokenizer, xml, ctype, json
          tools: composer:2

      - name: Validate PHP configuration
        run: php -v && composer --version

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # --- NUEVO: Instalar Node y compilar assets para que Vite genere el manifest.json ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies and Build Assets
        run: |
          npm install
          npm run build
      # ---------------------------------------------------------------------------------

      - name: Prepare environment
        run: |
          cp .env.example .env
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --force
          php artisan config:clear

      - name: Run automated tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zapateria_pos
          DB_USERNAME: zapateria_user
          DB_PASSWORD: secret_user_password
        run: composer test

      - name: Verify Docker Compose build
        run: docker compose build --pull --parallel